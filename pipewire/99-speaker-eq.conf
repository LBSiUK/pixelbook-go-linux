# Speaker EQ for Pixelbook Go (Atlas) — 8-band graphic EQ
#   80 Hz high-pass (fixed, speaker protection)
#   Bandwidth Q=0.67 (Wide)
#   Bands: 125=+1.96dB  250=+1.38dB  500=+0.58dB  1k=-0.63dB  2k=-1.38dB  4k=-2.39dB  8k=-4.27dB  16k=-8.31dB
#
# Routes to built-in speakers only; HDMI and headphones unaffected.

context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Speaker EQ"
        media.name       = "Speaker EQ"
        filter.graph = {
            nodes = [
                # Left channel
                { type = builtin  name = hp_l    label = bq_highpass   control = { "Freq" = 80.0  "Q" = 0.707  "Gain" = 0.0 } }
                { type = builtin  name = b1_l  label = bq_peaking   control = { "Freq" = 125.0  "Q" = 0.669  "Gain" = 1.96 } }
                { type = builtin  name = b2_l  label = bq_peaking   control = { "Freq" = 250.0  "Q" = 0.669  "Gain" = 1.38 } }
                { type = builtin  name = b3_l  label = bq_peaking   control = { "Freq" = 500.0  "Q" = 0.669  "Gain" = 0.58 } }
                { type = builtin  name = b4_l  label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 0.669  "Gain" = -0.63 } }
                { type = builtin  name = b5_l  label = bq_peaking   control = { "Freq" = 2000.0  "Q" = 0.669  "Gain" = -1.38 } }
                { type = builtin  name = b6_l  label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 0.669  "Gain" = -2.39 } }
                { type = builtin  name = b7_l  label = bq_peaking   control = { "Freq" = 8000.0  "Q" = 0.669  "Gain" = -4.27 } }
                { type = builtin  name = b8_l  label = bq_peaking   control = { "Freq" = 16000.0  "Q" = 0.669  "Gain" = -8.31 } }
                # Right channel
                { type = builtin  name = hp_r    label = bq_highpass   control = { "Freq" = 80.0  "Q" = 0.707  "Gain" = 0.0 } }
                { type = builtin  name = b1_r  label = bq_peaking   control = { "Freq" = 125.0  "Q" = 0.669  "Gain" = 1.96 } }
                { type = builtin  name = b2_r  label = bq_peaking   control = { "Freq" = 250.0  "Q" = 0.669  "Gain" = 1.38 } }
                { type = builtin  name = b3_r  label = bq_peaking   control = { "Freq" = 500.0  "Q" = 0.669  "Gain" = 0.58 } }
                { type = builtin  name = b4_r  label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 0.669  "Gain" = -0.63 } }
                { type = builtin  name = b5_r  label = bq_peaking   control = { "Freq" = 2000.0  "Q" = 0.669  "Gain" = -1.38 } }
                { type = builtin  name = b6_r  label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 0.669  "Gain" = -2.39 } }
                { type = builtin  name = b7_r  label = bq_peaking   control = { "Freq" = 8000.0  "Q" = 0.669  "Gain" = -4.27 } }
                { type = builtin  name = b8_r  label = bq_peaking   control = { "Freq" = 16000.0  "Q" = 0.669  "Gain" = -8.31 } }
            ]
            links = [
                { output = "hp_l:Out"  input = "b1_l:In" }
                { output = "b1_l:Out"  input = "b2_l:In" }
                { output = "b2_l:Out"  input = "b3_l:In" }
                { output = "b3_l:Out"  input = "b4_l:In" }
                { output = "b4_l:Out"  input = "b5_l:In" }
                { output = "b5_l:Out"  input = "b6_l:In" }
                { output = "b6_l:Out"  input = "b7_l:In" }
                { output = "b7_l:Out"  input = "b8_l:In" }
                { output = "hp_r:Out"  input = "b1_r:In" }
                { output = "b1_r:Out"  input = "b2_r:In" }
                { output = "b2_r:Out"  input = "b3_r:In" }
                { output = "b3_r:Out"  input = "b4_r:In" }
                { output = "b4_r:Out"  input = "b5_r:In" }
                { output = "b5_r:Out"  input = "b6_r:In" }
                { output = "b6_r:Out"  input = "b7_r:In" }
                { output = "b7_r:Out"  input = "b8_r:In" }
            ]
            inputs  = [ "hp_l:In"  "hp_r:In" ]
            outputs = [ "b8_l:Out"  "b8_r:Out" ]
        }
        capture.props = {
            node.name        = "effect_input.speaker_eq"
            media.class      = Audio/Sink
            audio.channels   = 2
            audio.position   = [ FL FR ]
            priority.session = 2500
        }
        playback.props = {
            node.name      = "effect_output.speaker_eq"
            node.passive   = true
            target.object  = "alsa_output.platform-avs_max98373.65536.HiFi__hw_MAX98373__sink"
            audio.channels = 2
            audio.position = [ FL FR ]
        }
    }
}
]
